[project]
name = "ediarum-sdk"
version = "0.3.1"
description = "Shared platform integration pieces for ediarum backend services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Malte Vogl", email = "telota@bbaw.de" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.1",
    "httpx2>=2.13.1",
    "sqlmodel>=0.0.47",
    "watchdog>=6.0.0",
]

[project.urls]
Repository = "https://www.ediarum.org/"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ediarum_sdk"]
